[project]
name = "real-madrid-ai-platform"
version = "1.0.0"
description = "AI-powered Real Madrid fan platform"
authors = [{name = "Caephas", email = "arinzeobidiegwu@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    # Core
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic-settings>=2.0,<3.0",

    # Database
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.13,<2.0",

    # ML
    "xgboost>=3.0,<4.0",
    "scikit-learn>=1.6,<2.0",
    "imbalanced-learn>=0.12,<1.0",
    "joblib>=1.4,<2.0",
    "pandas>=2.2,<3.0",

    # LLM
    "google-generativeai>=0.8,<0.9",
    "httpx>=0.27,<1.0",

    # Content
    "feedparser>=6.0,<7.0",
    "requests>=2.32,<3.0",

    # Scheduling
    "apscheduler>=3.10,<4.0",

    # Scraping (pipeline only)
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.3,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "black>=24.10,<25.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pipeline"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
